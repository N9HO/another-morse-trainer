# Flatpak manifest for CI (docs/desktop-design.md, §3).
#
# This repackages the app image Compose Desktop's createDistributable builds —
# launcher, app jars and a jlinked Java runtime — which desktop.yml tars into
# desktop/build/flatpak-src/app-image.tar.gz before running flatpak-builder. It
# exists to prove the sandbox, the permissions, the desktop entry and the
# AppStream metadata. The Flathub submission builds from source instead (the
# OpenJDK SDK extension plus an offline Gradle dependency list); that manifest
# is written when the submission is made, against a tagged release.
app-id: app.anothermorsetrainer.AnotherMorseTrainer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: another-morse-trainer
finish-args:
  # AWT has no Wayland backend in JDK 21; the window runs through XWayland.
  - --socket=x11
  - --share=ipc
  # Audio out (Morse, sidetone) and the microphone (CW decoder, Sending Analyzer).
  - --socket=pulseaudio
  # GPU rendering when AMT_RENDER=opengl; the default software renderer works without it.
  - --device=dri
  # Raw MIDI under /dev/snd, for USB Morse keys such as the Vail Adapter.
  - --device=all
  # Leaderboard board, the Vail repeater, the Short Stories news feed.
  - --share=network
  # Printing the Sending Drills sheet.
  - --socket=cups
  # "Save image…" for share cards.
  - --filesystem=xdg-pictures
modules:
  - name: another-morse-trainer
    buildsystem: simple
    sources:
      - type: archive
        path: ../../build/flatpak-src/app-image.tar.gz
        dest: app-image
      - type: file
        path: ../linux/app.anothermorsetrainer.AnotherMorseTrainer.desktop
      - type: file
        path: ../linux/app.anothermorsetrainer.AnotherMorseTrainer.metainfo.xml
      - type: file
        path: ../icons/icon-512.png
    build-commands:
      - mkdir -p /app/lib/amt /app/bin
      - cp -a app-image/. /app/lib/amt/
      - ln -s /app/lib/amt/bin/AnotherMorseTrainer /app/bin/another-morse-trainer
      - install -Dm644 app.anothermorsetrainer.AnotherMorseTrainer.desktop /app/share/applications/app.anothermorsetrainer.AnotherMorseTrainer.desktop
      - install -Dm644 app.anothermorsetrainer.AnotherMorseTrainer.metainfo.xml /app/share/metainfo/app.anothermorsetrainer.AnotherMorseTrainer.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/app.anothermorsetrainer.AnotherMorseTrainer.png
