name: iOS Build

# Compiles the iOS app (which lives under ios/) remotely so changes made from the
# Claude phone app can be verified without a laptop:
#   * logic-job  - builds/runs the Foundation-only MorseKit package + MorseKitCheck
#                  harness (fast feedback, no Xcode needed)
#   * ios-build  - real `xcodebuild` of the MorseTrainer iOS app on a macOS runner
#
# Path-filtered: this repo also holds the Android app, and a macOS runner bills at
# 10x a Linux one, so an Android-only change must not start this workflow. Both
# jobs set `working-directory: ios`, which is why the swift and xcodebuild
# invocations below still name their paths relative to the iOS tree.
#
# Triggers: pull requests, plus pushes to main. NOT pushes to every branch —
# that built each PR commit twice on macOS runners, at 10x billing for the
# duplicate. `pull_request` is the half that has to stay, because GitHub
# evaluates a `paths:` filter on `pull_request` against the whole base...head
# diff but on `push` against that one commit: a PR touching ios/ and then topped
# with a docs-only commit gets no push run, and merge-gate.yml would wait
# forever for a check that never appears. Same reasoning in android-ci.yml.
#
# The cost of dropping it: a branch pushed with no PR open gets no build. Use
# workflow_dispatch, or open the PR.
# `!ios/tools/**` because nothing under it reaches this build: the Xcode project
# references no file there and neither does Package.swift. Those are Python and
# shell helpers (the Discord triage bot, the App Store Connect scripts), and a
# change to one of them used to start two macOS runners to rebuild Swift that
# had not changed. The triage bot's own tests run in triage-bot.yml, on Linux.
# Later patterns win, so the negation must stay after `ios/**`.
on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "!ios/tools/**"
      - ".github/workflows/ios.yml"
      - "fixtures/**"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/tools/**"
      - ".github/workflows/ios.yml"
      - "fixtures/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-job:
    name: MorseKit logic checks
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Build MorseKit package
        run: swift build
      - name: Run MorseKitCheck harness
        run: swift run MorseKitCheck

  ios-build:
    name: Build MorseTrainer (iOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      # Match ios-release.yml: releases must use the iOS 26 SDK (App Store
      # Connect rejects older ones), so CI has to compile against the same SDK
      # or it can pass while a release build fails.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26.x on this runner."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -switch "$XC"

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -list -project MorseTrainer.xcodeproj

      - name: Build for iOS Simulator
        run: |
          # `generic/platform=iOS Simulator` builds against the simulator SDK
          # without pinning a specific device/runtime that the runner image may
          # have dropped.
          xcodebuild build \
            -project MorseTrainer.xcodeproj \
            -scheme MorseTrainer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
