name: Discord release announcement

# Announces a release on Discord, for BOTH apps.
#
# Triggered by the release workflows *finishing successfully* — not by the tag.
# That ordering matters: when this fired on the tag directly, it raced the build
# and announced ios-v1.1-b25 while that upload was still going, which then failed
# App Store validation. The announcement outlived the release it described. Now
# nothing is announced until the store actually has the build.
#
# Each app keeps its own changelog, scoped to its own subtree, so an Android
# release never lists iOS commits or vice versa.
#
# Which release it was comes from the `release-tag` artifact the release
# workflow's `tag` job uploads; a manual release run is on `main`, so its
# head_branch names no tag. (A tag-push run from before that artifact existed
# falls back to head_branch.) No artifact and no tag means nothing shipped, a
# dry run for instance, and nothing is announced. Four tag shapes:
#   ios-v*          App Store submission     android-v*       Play production
#   ios-beta-v*     TestFlight build         android-beta-v*  Play alpha/internal
# The changelog runs from the previous tag of the same platform, of either
# kind, so every build lists only what is new since the one before it.
#
# A TestFlight build's announcement carries the public join link from the
# repository variable TESTFLIGHT_PUBLIC_LINK (Settings -> Secrets and
# variables -> Actions -> Variables) when it is set; a manual run's
# testflight_link input overrides it. The link is fetched before posting.
#
# Manual runs (Actions tab or API) re-announce a release, and take inputs:
#   tag             — tag to announce; platform is inferred from its prefix. A
#                     tag that does not exist is announced as of this branch's
#                     head, with a warning.
#   testflight_link — public TestFlight join URL to include (verified; iOS only)
#   dry_run         — "true" builds and prints the payload but posts nothing
on:
  workflow_run:
    workflows:
      - "iOS release (App Store upload)"
      - "Android release (Google Play upload)"
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to announce (ios-v* or android-v*)'
        required: false
      testflight_link:
        description: 'Public TestFlight join link to include (https://testflight.apple.com/join/…)'
        required: false
      dry_run:
        description: 'Set to "true" to print the payload without posting'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: read

jobs:
  announce:
    runs-on: ubuntu-latest
    # Never announce a release that didn't happen. A manual run is always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # On workflow_run this defaults to the default branch, which is not
          # necessarily the released commit.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve which release this is
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          LINK_INPUT: ${{ github.event.inputs.testflight_link }}
          LINK_VAR: ${{ vars.TESTFLIGHT_PUBLIC_LINK }}
        run: |
          set -euo pipefail

          TAG="${TAG_INPUT:-}"
          if [ -z "$TAG" ] && [ -n "${RUN_ID:-}" ]; then
            # The release workflow's `tag` job names what it shipped.
            DIR="$(mktemp -d)"
            if gh run download "$RUN_ID" -R "$REPO" -n release-tag -D "$DIR" 2>/dev/null; then
              TAG="$(tr -d '[:space:]' < "$DIR/release-tag.txt")"
            else
              # Older runs, from before the artifact: a tag push's head_branch
              # is the tag. A manual run's is a branch, and falls through.
              TAG="${RUN_BRANCH:-}"
            fi
          fi

          case "$TAG" in
            ios-v*)             PLATFORM=ios;     KIND=release ;;
            ios-beta-v*)        PLATFORM=ios;     KIND=beta ;;
            android-v*)         PLATFORM=android; KIND=release ;;
            android-beta-v*)    PLATFORM=android; KIND=beta ;;
            *)
              echo "::notice::'$TAG' is not a release tag (workflow: ${RUN_WORKFLOW:-manual}) — nothing to announce."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac

          # A TestFlight join link belongs on a TestFlight build; a production
          # iOS release gets one only when a manual run passes it.
          LINK=""
          if [ "$PLATFORM" = "ios" ]; then
            LINK="${LINK_INPUT:-}"
            if [ -z "$LINK" ] && [ "$KIND" = "beta" ]; then LINK="${LINK_VAR:-}"; fi
          fi

          echo "skip=false"         >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND"         >> "$GITHUB_OUTPUT"
          echo "link=$LINK"         >> "$GITHUB_OUTPUT"
          echo "Announcing $TAG ($PLATFORM, $KIND)"

      - name: Build release info
        id: info
        if: steps.rel.outputs.skip != 'true'
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
          PLATFORM: ${{ steps.rel.outputs.platform }}
        run: |
          set -euo pipefail

          # The release is the tag when it exists (it can sit behind the
          # checked-out head on a manual re-announce); the head otherwise.
          if TAG_SHA="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
            END_SHA="$TAG_SHA"
            END="$TAG"
          else
            echo "::warning::Tag $TAG does not exist; announcing as of ${GITHUB_SHA:0:12}."
            END_SHA="$(git rev-parse HEAD)"
            END="${END_SHA:0:12}"
          fi

          # Keep each platform's changelog on its own tag line: an unfiltered
          # describe would happily return the other app's tag (or the
          # pre-monorepo `v1.1`) and start the changelog at someone else's
          # release. Both kinds count, so a production release after a run of
          # TestFlight/alpha builds lists only what the last testing build did not.
          PREV="$(git describe --tags --abbrev=0 \
                   --match "${PLATFORM}-v*" --match "${PLATFORM}-beta-v*" \
                   "${END_SHA}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="${PREV}..${END_SHA}"; else RANGE="$END_SHA"; fi
          if [ -n "$PREV" ]; then
            COMPARE="https://github.com/${REPO}/compare/${PREV}...${END}"
          else
            COMPARE="https://github.com/${REPO}/releases/tag/${TAG}"
          fi
          echo "compare=$COMPARE" >> "$GITHUB_OUTPUT"

          # Changelog: one bullet per commit, newest first. -25 caps it inside git
          # (piping through `head` dies of SIGPIPE under pipefail once the range
          # outgrows the cap — that's what broke the first two runs of this job).
          # Scoped to the app's own subtree, with CI/tooling/docs paths excluded:
          # those aren't release content.
          if [ "$PLATFORM" = "ios" ]; then
            LOG="$(git log --no-merges -25 --pretty=format:'• %s' "$RANGE" -- \
                   ios ':(exclude)ios/tools' ':(exclude)ios/HANDOFF.md')"
          else
            LOG="$(git log --no-merges -25 --pretty=format:'• %s' "$RANGE" -- \
                   android ':(exclude)android/tools' ':(exclude)android/HANDOFF.md')"
          fi
          [ -z "$LOG" ] && LOG="• (no commits found in range)"
          {
            echo 'changelog<<CHANGELOG_EOF'
            echo "$LOG"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Verify the TestFlight link resolves
        if: ${{ steps.rel.outputs.skip != 'true' && steps.rel.outputs.link != '' }}
        env:
          LINK: ${{ steps.rel.outputs.link }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$LINK" || echo 000)"
          echo "GET $LINK -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            if [ "${DRY_RUN:-}" = "true" ]; then
              echo "::warning::TestFlight link did not return 200 (got $CODE) — a real run would stop here."
            else
              echo "::error::TestFlight link did not return 200 (got $CODE); refusing to announce a dead link."
              exit 1
            fi
          fi

      - name: Post to Discord
        if: steps.rel.outputs.skip != 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.rel.outputs.tag }}
          PLATFORM: ${{ steps.rel.outputs.platform }}
          KIND: ${{ steps.rel.outputs.kind }}
          COMPARE: ${{ steps.info.outputs.compare }}
          CHANGELOG: ${{ steps.info.outputs.changelog }}
          TS: ${{ steps.info.outputs.ts }}
          LINK: ${{ steps.rel.outputs.link }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$PLATFORM" = "ios" ]; then
            EMOJI="📱"; LABEL="iOS"; COLOR=3447003
            if [ "$KIND" = "beta" ]; then
              BLURB="A new TestFlight build is out. Testers get it once Apple's beta review passes."
            else
              BLURB="A new build is submitted to the App Store and will go live once Apple approves it. TestFlight testers get it right away."
            fi
          else
            EMOJI="🤖"; LABEL="Android"; COLOR=3066993
            if [ "$KIND" = "beta" ]; then
              BLURB="A new testing build is on Google Play. Testers get it through the Play Store."
            else
              BLURB="A new build is rolling out on Google Play."
            fi
          fi

          # jq builds correctly-escaped JSON from the raw values.
          PAYLOAD="$(jq -n \
            --arg tag "$TAG" \
            --arg compare "$COMPARE" \
            --arg log "$CHANGELOG" \
            --arg ts "$TS" \
            --arg link "${LINK:-}" \
            --arg emoji "$EMOJI" \
            --arg label "$LABEL" \
            --arg blurb "$BLURB" \
            --argjson color "$COLOR" \
            '{
              username: "Another Morse Trainer",
              embeds: [{
                title: "\($emoji) New build — \($tag)",
                url: $compare,
                description: ((if $link != ""
                               then "A new TestFlight build is out.\n\n🔗 **Join the beta:** \($link)\n\n"
                               else $blurb + "\n\n" end)
                              + "**Changelog**\n\($log)"),
                color: $color,
                footer: { text: "Another Morse Trainer • \($label)" },
                timestamp: $ts
              }]
            }')"

          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "── dry run: payload that would be posted ──"
            printf '%s\n' "$PAYLOAD"
            if [ -n "${WEBHOOK:-}" ]; then
              echo "── dry run: DISCORD_WEBHOOK_URL secret is present ──"
            else
              echo "── dry run: DISCORD_WEBHOOK_URL secret is MISSING ──"
            fi
            exit 0
          fi

          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$WEBHOOK" \
            && echo "Posted $TAG to Discord."
