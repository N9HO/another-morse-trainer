name: Merge gate

# The single status check to mark "required" on main.
#
# Why this exists: ios.yml, android-ci.yml and triage-bot.yml are path-filtered,
# and a workflow whose paths filter does not match creates NO check run at all —
# not a skipped one, not a pending one, nothing. A required status check that
# never reports blocks its pull request forever, so none of those builds can
# safely be marked required. This workflow has no paths filter, so it always runs
# and always reports, and it derives its result from the builds that the pull
# request actually needed.
#
# It mirrors how GitHub evaluates a paths filter on `pull_request`: against the
# full base...head diff of the PR, not against the latest push.
#
# It also enforces the parity rule (PARITY.md, #171): a pull request whose diff
# touches only one of ios/ (minus ios/tools/) and android/ (minus
# android/store-assets/), Markdown excluded, must say why in the
# Parity section of its description — a paired issue for the other side, a
# platform limitation recorded in PARITY.md, or a platform-internal change with
# nothing user-visible. That check runs first and fails fast, before any wait
# on the builds. Bot-authored PRs (dependabot) cannot tick a box and are
# exempt. The accepted lines are the ones in .github/pull_request_template.md;
# the bold token at the start of each line is what the grep below keys on, so
# rename them in both places or not at all.
#
# The same step enforces the guide rule (#172): the user guide on the website
# documents every mode and setting and changes in the same release as the app,
# so any PR that changes app code without declaring itself platform-internal
# must also tick "Guide updated" or "No guide change needed" in its Guide
# section. Both are declarations, not proofs — the website's source is outside
# this repository — but a reviewer can read them.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for the platform builds this PR needs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail

          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                            -H "Accept: application/vnd.github+json" "$@"; }

          if [ -z "${PR:-}" ]; then
            echo "Not a pull request (manual run) — nothing to gate."
            exit 0
          fi

          # ---- 1. Which files does this PR touch? (paginated) ----
          FILES=""
          page=1
          while :; do
            batch="$(api "https://api.github.com/repos/$REPO/pulls/$PR/files?per_page=100&page=$page" \
                     | jq -r '.[].filename')"
            [ -z "$batch" ] && break
            FILES="$FILES$batch"$'\n'
            page=$((page + 1))
            [ "$page" -gt 30 ] && break
          done

          echo "── files changed in this PR ──"
          printf '%s' "$FILES" | sed 's/^/  /'

          # ---- 1b. Parity: does a single-platform PR say why? ----
          # The two lists below are the user-facing trees. ios/tools/ is the
          # triage bot and release scripts, android/store-assets is Play
          # listing copy, and a Markdown file is documentation; none of those
          # is the app, so a change there is not a platform change. fixtures/
          # counts for both by construction.
          IOS_TOUCHED=0; ANDROID_TOUCHED=0
          if printf '%s' "$FILES" | grep -vE '^ios/tools/|\.md$' | grep -qE '^ios/'; then
            IOS_TOUCHED=1
          fi
          if printf '%s' "$FILES" | grep -vE '^android/store-assets/|\.md$' | grep -qE '^android/'; then
            ANDROID_TOUCHED=1
          fi

          if [ $((IOS_TOUCHED + ANDROID_TOUCHED)) -eq 1 ]; then
            side=ios; other=Android
            [ "$ANDROID_TOUCHED" -eq 1 ] && { side=android; other=iOS; }
            echo
            echo "── parity: this PR touches only $side/ ──"

            if [ "${PR_AUTHOR_TYPE:-}" = "Bot" ]; then
              echo "  Author ${PR_AUTHOR:-?} is a bot — parity declaration not required."
            else
              # One checked box from the template's Parity section. The
              # "Both platforms" box is not accepted here: the diff says
              # otherwise, so ticking it is a mistake, not a declaration.
              # PR bodies arrive with CRLF line ends; the patterns anchor at
              # the start of a line and ignore what follows the token.
              body_has() { printf '%s\n' "${PR_BODY:-}" | grep -qiE "$1"; }
              BOX='^[[:space:]]*[-*][[:space:]]*\[x\][[:space:]]*\*\*'
              declared=""
              if body_has "${BOX}paired issue\*\*.*#[0-9]+"; then
                declared="paired issue"
              elif body_has "${BOX}platform limitation\*\*"; then
                declared="platform limitation"
                if ! printf '%s' "$FILES" | grep -qxE 'PARITY\.md'; then
                  echo "::error::Parity: the PR declares a platform limitation but does not change PARITY.md. Record the exception there in this PR — that file is the one place they live."
                  exit 1
                fi
              elif body_has "${BOX}platform-internal\*\*"; then
                declared="platform-internal"
              fi

              if [ -n "$declared" ]; then
                echo "  Declared: $declared."
              else
                echo "::error::Parity: this PR changes only $side/ and its description does not say what happens on $other. Tick one box in the Parity section (see .github/pull_request_template.md): a paired issue with its #number, a platform limitation recorded in PARITY.md in this PR, or platform-internal (nothing user-visible)."
                if body_has "${BOX}both platforms\*\*"; then
                  echo "::error::Parity: 'Both platforms' is ticked, but the diff touches only $side/."
                fi
                if body_has "${BOX}paired issue\*\*"; then
                  echo "::error::Parity: 'Paired issue' is ticked but names no issue — add the #number on that line."
                fi
                exit 1
              fi
            fi
          fi

          # ---- 1c. Guide: does an app change say what happens to the docs? ----
          # Any app-code change (either tree, Markdown excluded) that is not
          # declared platform-internal changes something the guide may
          # describe, so it has to say whether the guide was updated.
          if [ $((IOS_TOUCHED + ANDROID_TOUCHED)) -ge 1 ] && [ "${PR_AUTHOR_TYPE:-}" != "Bot" ]; then
            body_has() { printf '%s\n' "${PR_BODY:-}" | grep -qiE "$1"; }
            BOX='^[[:space:]]*[-*][[:space:]]*\[x\][[:space:]]*\*\*'
            echo
            echo "── guide: this PR changes app code ──"
            if body_has "${BOX}platform-internal\*\*"; then
              echo "  Declared platform-internal — no guide declaration required."
            elif body_has "${BOX}guide updated\*\*"; then
              echo "  Declared: guide updated."
            elif body_has "${BOX}no guide change needed\*\*"; then
              echo "  Declared: no guide change needed."
            else
              echo "::error::Guide: this PR changes app code and its description does not say what happens to the user guide. Tick one box in the Guide section (see .github/pull_request_template.md): guide updated (say which sections), or no guide change needed (say why)."
              exit 1
            fi
          fi

          # ---- 2. Which builds must therefore pass? ----
          # These conditions must stay in step with the `paths:` filters in
          # ios.yml, android-ci.yml and triage-bot.yml.
          NEED=""
          # ios.yml is `ios/**` minus `!ios/tools/**`, so drop the tools lines
          # before asking whether any iOS source changed. When a PR touches
          # nothing but ios/tools/, the first grep selects no lines and exits 1,
          # which `pipefail` turns into a false condition — exactly right: no
          # iOS build is required for it.
          if printf '%s' "$FILES" | grep -vE '^ios/tools/' \
               | grep -qE '^(ios/|fixtures/|\.github/workflows/ios\.yml$)'; then
            NEED="$NEED MorseKit-logic-checks Build-MorseTrainer-iOS"
          fi
          if printf '%s' "$FILES" \
               | grep -qE '^(ios/tools/discord_triage/|\.github/workflows/triage-bot\.yml$)'; then
            NEED="$NEED Triage-bot-tests"
          fi
          if printf '%s' "$FILES" | grep -qE '^(android/|fixtures/|\.github/workflows/android-ci\.yml$|\.github/scripts/android-smoke\.sh$)'; then
            NEED="$NEED Build-debug-APK Build-release-APK Release-smoke-test Android-lint"
          fi

          if [ -z "$NEED" ]; then
            echo
            echo "✅ This PR touches neither platform subtree — no build is required."
            exit 0
          fi

          # Map the slugs back to the real check-run names (which contain spaces).
          name_for() {
            case "$1" in
              MorseKit-logic-checks)   echo "MorseKit logic checks" ;;
              Build-MorseTrainer-iOS)  echo "Build MorseTrainer (iOS)" ;;
              Build-debug-APK)         echo "Build debug APK" ;;
              Build-release-APK)       echo "Build release APK" ;;
              Release-smoke-test)      echo "Release smoke test" ;;
              Android-lint)            echo "Android lint" ;;
              Triage-bot-tests)        echo "Triage bot tests" ;;
            esac
          }

          echo
          echo "── builds required for this PR ──"
          for slug in $NEED; do echo "  $(name_for "$slug")"; done

          # ---- 3. Wait for each required check on the PR head SHA ----
          DEADLINE=$(( $(date +%s) + 2400 ))   # 40 minutes
          while :; do
            RUNS="$(api "https://api.github.com/repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100")"

            pending=0
            failed=0
            echo
            echo "── $(date -u +%H:%M:%SZ) ──"
            for slug in $NEED; do
              n="$(name_for "$slug")"
              concl="$(printf '%s' "$RUNS" \
                       | jq -r --arg n "$n" \
                         '[.check_runs[] | select(.name == $n)]
                          | sort_by(.started_at) | last
                          | if . == null then "absent"
                            elif .status != "completed" then .status
                            else .conclusion end')"
              echo "  $n: $concl"
              case "$concl" in
                success)                      ;;
                absent|queued|in_progress|pending|waiting) pending=1 ;;
                skipped|neutral)              ;;   # ran and opted out — not a failure
                *)                            failed=1 ;;
              esac
            done

            if [ "$failed" -eq 1 ]; then
              echo
              echo "::error::A required platform build failed on $HEAD_SHA. See the runs above."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo
              echo "✅ Every build this PR required has passed."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo
              echo "::error::Timed out waiting for a required platform build on $HEAD_SHA."
              exit 1
            fi
            sleep 20
          done
