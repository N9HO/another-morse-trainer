name: Desktop CI

# Builds the Windows and Linux desktop app (desktop/, Compose Multiplatform
# Desktop on the JVM; docs/desktop-design.md) remotely, since nobody behind this
# project has a JDK installed. Four jobs:
#
#   Desktop unit tests        — ./gradlew :app:test on Linux: the morsekit logic
#                               tests, pinned by fixtures/ like the other trees.
#   Desktop Linux packages    — createDistributable → app-image tarball and an
#                               AppImage; then launches the packaged app under
#                               Xvfb and screenshots it (a fresh profile, which
#                               stops at onboarding, and a seeded one at Home).
#                               Those screenshots are the only way anyone sees
#                               this app run, the job the emulator smoke test
#                               does for Android.
#   Desktop Flatpak           — flatpak-builder over that app image, in the
#                               Flathub infrastructure container: proves the
#                               sandbox manifest, desktop entry and metainfo.
#   Desktop Windows packages  — packageMsi, and an unsigned MSIX made by
#                               makeappx.exe from the app image (the Store signs
#                               MSIX submissions; nothing here holds a
#                               certificate). Windows bills at 2x Linux, so only
#                               what needs Windows runs there. No macOS runner.
#
# Nothing is published: artifacts only. Release tags will be desktop-v*.
#
# Triggers mirror android-ci.yml, for the same reasons (see its header): the
# pull_request paths filter is evaluated against the whole PR diff, which is
# what merge-gate.yml assumes when it decides these checks are required. These
# jobs are path-filtered, so none of them may ever be a required status check
# on main — merge-gate.yml requires them only for a PR whose diff needs them.
on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "fixtures/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "fixtures/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Desktop unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # testLogging in app/build.gradle.kts prints every test as it passes, so
      # a green log still shows what ran.
      - name: Run unit tests
        run: ./gradlew :app:test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-test-report
          path: desktop/app/build/reports/tests/test/
          if-no-files-found: warn

  linux:
    name: Desktop Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the app image (jlinked runtime included)
        run: ./gradlew :app:createDistributable --stacktrace

      - name: Locate and tar the app image
        run: |
          set -euo pipefail
          IMG="$(dirname "$(dirname "$(find app/build/compose/binaries/main/app -path '*/bin/AnotherMorseTrainer' -type f | head -1)")")"
          echo "app image: $IMG"
          du -sh "$IMG"
          mkdir -p build/flatpak-src
          tar -C "$IMG" -czf build/flatpak-src/app-image.tar.gz .
          ls -l build/flatpak-src/app-image.tar.gz
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Upload the app image tarball
        uses: actions/upload-artifact@v6
        with:
          name: desktop-linux-app-image
          path: desktop/build/flatpak-src/app-image.tar.gz
          if-no-files-found: error

      # appimagetool pinned to a release, not "continuous". It is itself an
      # AppImage; extract-and-run avoids needing FUSE on the runner.
      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          ID=app.anothermorsetrainer.AnotherMorseTrainer
          APPDIR="$RUNNER_TEMP/AppDir"
          mkdir -p "$APPDIR/usr/lib/amt" "$APPDIR/usr/share/metainfo"
          cp -a "$IMG"/. "$APPDIR/usr/lib/amt/"
          cp packaging/linux/$ID.desktop "$APPDIR/$ID.desktop"
          cp packaging/icons/icon-512.png "$APPDIR/$ID.png"
          cp packaging/linux/$ID.metainfo.xml "$APPDIR/usr/share/metainfo/$ID.appdata.xml"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/amt/bin/AnotherMorseTrainer" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          mkdir -p build/appimage
          "$RUNNER_TEMP/appimagetool" --no-appstream "$APPDIR" build/appimage/AnotherMorseTrainer-x86_64.AppImage
          ls -l build/appimage/

      - name: Upload the AppImage
        uses: actions/upload-artifact@v6
        with:
          name: desktop-linux-appimage
          path: desktop/build/appimage/*.AppImage
          if-no-files-found: error

      # The only runtime check this app has. It runs the packaged launcher (not
      # ./gradlew run), so a jlink module missing from the runtime shows up
      # here as a crash, not later on a user's machine. Each launch must still
      # be running after 25 s; the screenshot is taken then.
      - name: Launch under Xvfb and screenshot
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick >/dev/null
          Xvfb :99 -screen 0 1024x1000x24 &
          export DISPLAY=:99
          sleep 2
          LAUNCHER="$IMG/bin/AnotherMorseTrainer"
          mkdir -p shots
          launch() {
            name="$1"; dir="$2"
            AMT_CONFIG_DIR="$dir" "$LAUNCHER" > "shots/$name.log" 2>&1 &
            pid=$!
            sleep 25
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::The app exited within 25 s ($name). Its output:"
              cat "shots/$name.log"
              exit 1
            fi
            import -window root "shots/$name.png"
            kill "$pid"; wait "$pid" 2>/dev/null || true
            echo "── $name: still running at 25 s; output:"
            cat "shots/$name.log"
          }
          launch onboarding "$RUNNER_TEMP/amt-fresh"
          mkdir -p "$RUNNER_TEMP/amt-seeded"
          echo '{"onboardingDone": true}' > "$RUNNER_TEMP/amt-seeded/amt_settings.json"
          launch home "$RUNNER_TEMP/amt-seeded"
          ls -l shots

      # Every screen, composed at least once: the packaged app is launched
      # straight onto each route (AMT_START_ROUTE, Main.kt) with the seeded
      # profile, and must still be running after 10 s with no exception in its
      # output. Nothing is clicked, so this proves each screen opens, not that
      # it works; the contact sheet is for a human to look at.
      - name: Open every screen under Xvfb
        run: |
          set -uo pipefail
          export DISPLAY=:99
          pgrep -x Xvfb >/dev/null || { Xvfb :99 -screen 0 1024x1000x24 & sleep 2; }
          LAUNCHER="$IMG/bin/AnotherMorseTrainer"
          mkdir -p shots/screens
          failed=""
          for tag in journey "quiz:Characters" "quiz:Common Words" "quiz:Confusion Drill" cw77 \
                     headCopy typeIt qrq rapidFire listen story exam pileup contest \
                     games invaders galaga defender dungeon frogger asteroids \
                     sending sendingDrills sendingAnalyzer repeater cwDecoder \
                     reference startHere dailyDit firstFour operatingProcedure settings stats leaderboard; do
            file="$(echo "$tag" | tr ': ' '__')"
            AMT_CONFIG_DIR="$RUNNER_TEMP/amt-seeded" AMT_START_ROUTE="$tag" \
              "$LAUNCHER" > "shots/screens/$file.log" 2>&1 &
            pid=$!
            sleep 10
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::$tag: the app exited within 10 s"
              failed="$failed $file"
            elif grep -qE 'Exception|Error:' "shots/screens/$file.log"; then
              echo "::error::$tag: an exception was logged"
              failed="$failed $file"
            fi
            import -window root -crop 480x900+272+50 +repage "shots/screens/$file.png" || true
            kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null || true
          done
          for f in $failed; do echo "── $f.log"; cat "shots/screens/$f.log"; done
          montage shots/screens/*.png -tile 8x -geometry 240x450+4+4 -background '#0b1a2e' shots/all-screens.png || true
          [ -z "$failed" ] || { echo "::error::Screens that failed to open:$failed"; exit 1; }

      - name: Upload launch screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-linux-screenshots
          path: desktop/shots/
          if-no-files-found: warn

  flatpak:
    name: Desktop Flatpak
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Download the app image built above
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-app-image
          path: desktop/build/flatpak-src

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: AnotherMorseTrainer.flatpak
          manifest-path: desktop/packaging/flatpak/app.anothermorsetrainer.AnotherMorseTrainer.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  windows:
    name: Desktop Windows packages
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      # Placeholders until the maintainer copies Partner Center's product
      # identity into repository variables (docs/desktop-design.md, §6). A
      # package built with these is for checking the build only.
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'AnotherMorseTrainer.PLACEHOLDER' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=PLACEHOLDER-SET-MSIX_PUBLISHER' }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'PLACEHOLDER set MSIX_PUBLISHER_DISPLAY_NAME' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The Compose plugin downloads the WiX toolset itself for packageMsi.
      - name: Build the MSI and the app image
        run: ./gradlew :app:packageMsi :app:createDistributable --stacktrace

      - name: Assemble and pack the MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Recurse app/build/compose/binaries/main/app -Filter AnotherMorseTrainer.exe | Select-Object -First 1
          if (-not $exe) { throw "No AnotherMorseTrainer.exe in the app image" }
          $img = $exe.Directory.FullName
          Write-Host "app image: $img"
          $version = (Select-String -Path app/build.gradle.kts -Pattern 'val desktopVersionName = "([0-9.]+)"').Matches[0].Groups[1].Value + ".0"
          Write-Host "MSIX version: $version"

          $layout = Join-Path $env:RUNNER_TEMP 'msix-layout'
          New-Item -ItemType Directory -Force -Path $layout | Out-Null
          Copy-Item -Recurse -Force (Join-Path $img '*') $layout
          Copy-Item -Recurse -Force packaging/msix/Assets (Join-Path $layout 'Assets')
          $manifest = Get-Content packaging/msix/AppxManifest.xml -Raw
          $manifest = $manifest.Replace('@IDENTITY_NAME@', $env:MSIX_IDENTITY_NAME)
          $manifest = $manifest.Replace('@PUBLISHER@', $env:MSIX_PUBLISHER)
          $manifest = $manifest.Replace('@PUBLISHER_DISPLAY_NAME@', $env:MSIX_PUBLISHER_DISPLAY_NAME)
          $manifest = $manifest.Replace('@VERSION@', $version)
          if ($manifest -match '@[A-Z_]+@') { throw "Unfilled token in AppxManifest.xml: $($Matches[0])" }
          if ($env:MSIX_PUBLISHER -like '*PLACEHOLDER*') {
            Write-Host "::warning::MSIX identity is a placeholder (repository variables MSIX_* not set); this package is for build checks only and the Store will reject it."
          }
          Set-Content -Path (Join-Path $layout 'AppxManifest.xml') -Value $manifest -Encoding utf8

          $kits = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $sdk = Get-ChildItem $kits -Directory | Where-Object { $_.Name -match '^10\.' -and (Test-Path (Join-Path $_.FullName 'x64\makeappx.exe')) } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "makeappx.exe not found under $kits" }
          $makeappx = Join-Path $sdk.FullName 'x64\makeappx.exe'
          Write-Host "makeappx: $makeappx"

          New-Item -ItemType Directory -Force -Path build/msix | Out-Null
          $out = "build/msix/AnotherMorseTrainer-$version-x64.msix"
          & $makeappx pack /d $layout /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed ($LASTEXITCODE)" }
          Get-ChildItem build/msix | Format-Table Name, Length
          Get-ChildItem -Recurse app/build/compose/binaries/main/msi | Format-Table Name, Length

      # Not a gate: whether a hosted Windows runner's session can show a window
      # is not something this project controls. The step says what it saw.
      - name: Launch the app briefly and screenshot
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse app/build/compose/binaries/main/app -Filter AnotherMorseTrainer.exe | Select-Object -First 1
          $env:AMT_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'amt-fresh'
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Host "::warning::The app exited within 25 s (code $($p.ExitCode))." }
          else { Write-Host "Still running at 25 s." }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $bmp.Save((Join-Path (Get-Location) 'shots/windows.png'))
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Upload the MSI
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-msi
          path: desktop/app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload the MSIX (unsigned; for Store upload only)
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-msix
          path: desktop/build/msix/*.msix
          if-no-files-found: error

      - name: Upload the Windows screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-screenshot
          path: desktop/shots/
          if-no-files-found: warn
