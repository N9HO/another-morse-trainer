name: Android release (Google Play upload)

# Fires when you push an ANDROID version tag
# (e.g. `git tag android-v1.12.2 && git push origin android-v1.12.2`).
#
# The tag prefix matters: this is a monorepo holding both apps, and the iOS
# announcement workflow watches `ios-v*`. A bare `v*` tag would fire both, so
# each platform releases under its own namespace and the two cadences stay
# independent. (Version numbers live in android/app/build.gradle.kts and in the
# iOS project file; they are not restated here, to keep them from drifting.)
# Builds the SIGNED app bundle (AAB) and uploads it to Google Play. A tag push
# releases to the PRODUCTION track with a full rollout: the apps left beta
# behind, and a tag is the deliberate act that ships to every user. The iOS
# twin (ios-release.yml) submits to App Store review on the same trigger.
#
# A manual run can pick another track (see `track` below) — "alpha" is the
# closed-testing track this workflow used to target, "internal" the internal
# testing one — for a build you want testers to see before it goes to
# everyone. Production needs the app's Play Console setup to be complete
# (store listing, content rating, data safety, and — on a personal developer
# account created after November 2023 — the closed-test requirement met and
# production access granted); until then the upload fails with a policy error
# from the Play API and nothing is consumed except the versionCode.
#
# Release notes for the Play listing come from
# android/store-assets/whatsnew/whatsnew-<locale> (Play caps them at 500
# characters). Edit that file in the same PR as the version bump.
#
# It degrades gracefully: if the signing/Play secrets aren't configured yet, it
# builds the bundle and uploads it as a workflow artifact instead of failing, so
# the workflow is safe to merge before Play Console setup is finished.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   - `base64 -i amt-upload.jks` (the upload keystore)
#   ANDROID_KEYSTORE_PASSWORD - keystore (store) password
#   ANDROID_KEY_ALIAS         - key alias (e.g. amt-upload)
#   ANDROID_KEY_PASSWORD      - key password
#   PLAY_SERVICE_ACCOUNT_JSON - the full JSON of a Google Play service account
#                               with "Release manager" access (see RELEASE.md)
#
# NOTE: the app must already exist in Play Console and have had ONE manual upload
# on the target track before the API will accept automated uploads.
#
# Manual runs (Actions tab or API) take two inputs:
#   dry_run — "true" builds and signs the AAB, reports which secrets resolved and
#             checks the signer fingerprint, then STOPS before the Play upload.
#             Use this to prove the pipeline in the monorepo without burning a
#             versionCode: Play permanently rejects a reused one.
#   track   — Play track to upload to. Defaults to "production"; "alpha"
#             (closed testing) or "internal" for a testers-first build.

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to "true" to build and sign but skip the Play upload'
        required: false
        default: 'false'
      track:
        description: 'Play track: production (default), alpha (closed testing) or internal'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - alpha
          - internal

permissions:
  contents: read

jobs:
  release:
    name: Build + upload AAB
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # A tag push has no inputs, so this resolves to production for a release.
      PLAY_TRACK: ${{ github.event.inputs.track || 'production' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      # First run in the monorepo: prove the secrets survived the move before
      # trusting a real release with them. Prints presence only — never values.
      - name: Report which secrets resolved
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "dry_run = '${{ github.event.inputs.dry_run }}'"
          echo "track   = '$PLAY_TRACK'"
          report() {
            if [ -n "${2:-}" ]; then
              echo "  ✅ $1  (set)"
            else
              echo "  ❌ $1  (EMPTY — this release would fall back to an artifact upload)"
            fi
          }
          echo "Signing + Play secrets:"
          report ANDROID_KEYSTORE_BASE64   "$KEYSTORE_B64"
          report ANDROID_KEYSTORE_PASSWORD "$STORE_PASSWORD"
          report ANDROID_KEY_ALIAS         "$KEY_ALIAS"
          report ANDROID_KEY_PASSWORD      "$KEY_PASSWORD"
          report PLAY_SERVICE_ACCOUNT_JSON "$PLAY_JSON"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Recreate signing config from secrets
        if: env.KEYSTORE_B64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Decode leniently: pasted base64 may carry CRLF/whitespace (Windows
          # clipboards) or wrapper lines like certutil's -----BEGIN/END-----
          # headers. --ignore-garbage skips every non-base64 character, so any
          # paste style decodes as long as the base64 payload itself is intact.
          echo "$KEYSTORE_B64" | base64 -d --ignore-garbage > "$RUNNER_TEMP/amt-upload.jks"
          # Fail loudly (before a confusing Gradle signing error) if what we
          # decoded is obviously not a keystore.
          SIZE=$(stat -c%s "$RUNNER_TEMP/amt-upload.jks")
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::Decoded keystore is only ${SIZE} bytes — the ANDROID_KEYSTORE_BASE64 secret does not contain a valid base64-encoded keystore. Re-create it (macOS: base64 -i amt-upload.jks | pbcopy; PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('amt-upload.jks')) | Set-Clipboard) and paste the result as the secret value."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/amt-upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed AAB
        run: ./gradlew :app:bundleRelease --stacktrace

      # Proves the AAB was signed by the real upload key, not a debug key —
      # Play rejects a wrong signer, and the dry run is where we want to find out.
      - name: Verify the AAB signer fingerprint
        if: env.KEYSTORE_B64 != ''
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          EXPECTED="57:97:26:3B:2E:3D:3A:AC:84:51:68:0E:97:25:F3:61:86:63:CF:FA:20:31:30:E8:95:CE:F6:B7:85:5F:EB:BC"
          ACTUAL=$(keytool -printcert -jarfile "$AAB" \
                   | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' \r')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "✅ signed by the upload key"
          else
            echo "::error::AAB signer does not match the registered upload key. Play would reject this."
            exit 1
          fi

      # Release notes are optional on Play, but a production release without
      # them looks abandoned. Fail before the upload rather than ship blank.
      - name: Check the release notes exist
        if: env.PLAY_TRACK == 'production' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          NOTES=store-assets/whatsnew/whatsnew-en-US
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing or empty. Write the release notes for this version before tagging a production release."
            exit 1
          fi
          LEN=$(wc -m < "$NOTES")
          if [ "$LEN" -gt 500 ]; then
            echo "::error::$NOTES is $LEN characters; Play allows 500."
            exit 1
          fi
          echo "release notes ($LEN chars):"; cat "$NOTES"

      - name: Upload to Google Play
        if: env.PLAY_JSON != '' && env.KEYSTORE_B64 != '' && github.event.inputs.dry_run != 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.anothermorsetrainer
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # production on a tag push; a manual run may pick alpha or internal.
          track: ${{ env.PLAY_TRACK }}
          # completed = full rollout to everyone on the track, no staged
          # percentage. Halting or staging a rollout is a Play Console action.
          status: completed
          whatsNewDirectory: android/store-assets/whatsnew

      # "Precondition check failed" from the Play API on the production track
      # is Play Console refusing the release, not the build: the app's setup
      # tasks (store listing, content rating, data safety, target audience)
      # are incomplete, or production access has not been granted to the
      # account. The AAB was uploaded to a draft edit that was then discarded,
      # so the versionCode is NOT spent; finish the Console side and re-run.
      - name: Explain a Play refusal
        if: failure() && env.PLAY_TRACK == 'production'
        run: |
          echo "::error::Google Play refused the production release. If the error above is 'Precondition check failed', complete the app's setup tasks in Play Console (Dashboard) and confirm production access, then re-run this workflow; the versionCode is not consumed by a discarded edit. The AAB is attached to this run for a manual upload."

      - name: Dry run — upload skipped
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run: AAB built, signed and verified. Play upload skipped, no versionCode consumed."

      - name: Save AAB as artifact (fallback / record)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
