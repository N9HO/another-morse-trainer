name: Android CI

# Compiles the Android app (which lives under android/) remotely so changes made
# from the Claude phone app can be verified without a laptop (parity with ios.yml).
#
# Four jobs. Three run in parallel; the smoke test waits on the release build.
#
#   Build debug APK    — unit tests + assembleDebug. Debug builds are NOT
#                        minified, so this job says nothing about R8.
#   Android lint       — AGP's own lint, which nothing used to run. Exclusions
#                        in app/lint.xml.
#   Build release APK  — assembleRelease, which is the only thing here that runs
#                        R8 and the resource shrinker (isMinifyEnabled /
#                        isShrinkResources in app/build.gradle.kts).
#   Release smoke test — boots an emulator and runs that APK, because the job
#                        above proves only that it builds. It also rotates the
#                        device and asserts MainActivity is not recreated, which
#                        is the only check anywhere that android:configChanges is
#                        actually doing its job.
#
# Path-filtered so an iOS-only change does not start a Gradle build. The two
# Gradle jobs set `working-directory: android`, which covers every `run:` step —
# but NOT the `uses:` steps, so the upload-artifact paths below are spelled from
# the repo root. The smoke job stays at the repo root throughout.

# Triggers: pull requests, plus pushes to main. NOT pushes to every branch —
# that built each PR commit twice, once per event. `pull_request` is the trigger
# that has to stay: GitHub evaluates a `paths:` filter on `pull_request` against
# the whole base...head diff, but on `push` against that one commit. A PR that
# touches android/ and is then topped with a docs-only commit gets no push run
# at all, and merge-gate.yml — which derives what to require from the full PR
# diff — would wait for a check that never appears. The push run was the
# expendable half.
#
# The cost of dropping it: a branch pushed with no PR open gets no build. Use
# workflow_dispatch, or open the PR.
on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/scripts/android-smoke.sh"
      - "fixtures/**"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/scripts/android-smoke.sh"
      - "fixtures/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # AGP ships lint and nothing was running it — the best bug-per-line-of-config
  # available on this side of the repo. Its exclusions live in app/lint.xml; the
  # vendored CW decoder is exempt there, since a finding inside a byte-identical
  # firmware port is an invitation to break its provenance.
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run lint
        run: ./gradlew :app:lint --stacktrace

      # `if: always()` on purpose: the run that FAILS is the one whose report you
      # most want to read, and the text report in the log above is truncated for
      # long findings.
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          if-no-files-found: warn

  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Without a signing config, assembleRelease emits app-release-UNSIGNED.apk,
      # which no device will install — so the R8'd build could be compiled but
      # never actually run. app/build.gradle.kts already picks up a
      # keystore.properties if one exists (it is gitignored), so writing a
      # throwaway one here makes the artifact installable without involving the
      # real upload key. That key lives only in the ANDROID_KEYSTORE_* secrets
      # used by android-release.yml, and nothing here touches it.
      #
      # The key is regenerated every run, so consecutive CI APKs cannot upgrade
      # over each other — see the install caveats on the artifact step below.
      - name: Generate a throwaway signing key
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ci-throwaway.jks" \
            -storepass ci-throwaway -keypass ci-throwaway \
            -alias ci -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Android CI throwaway, O=another-morse-trainer, C=US"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/ci-throwaway.jks
          storePassword=ci-throwaway
          keyAlias=ci
          keyPassword=ci-throwaway
          EOF

      # The one step in CI that exercises R8 and the resource shrinker. The
      # shipped artifact is an AAB (android-release.yml runs bundleRelease), but
      # both tasks read the same minify/shrink config, so a keep rule missing
      # here is a keep rule missing there.
      - name: Assemble release APK (runs R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Report release APK size and R8 outputs
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK" | awk '{print "release APK: " $5 " bytes"}'
          echo "R8 outputs (all of these are in the uploaded artifact):"
          ls -1s app/build/outputs/mapping/release/ | sed 's/^/  /'

      # Ships the APK together with everything R8 wrote: mapping.txt to
      # deobfuscate a crash from this build, and whichever usage/resource
      # reports this AGP version emits — the step above lists what they were.
      #
      # This job proves the shrunk build compiles and packages, nothing more.
      # Whether it RUNS is the smoke job below, which installs this exact APK.
      - name: Upload release APK + R8 mapping
        uses: actions/upload-artifact@v6
        with:
          name: app-release-ci-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/
          if-no-files-found: error

  # The only runtime coverage this app has. R8 breaks things at runtime, not at
  # build time — a stripped keep rule surfaces as ClassNotFoundException or
  # Resources$NotFoundException on the device, and `Build release APK` above is
  # green either way. There are no instrumented tests in this repo, and no
  # Android hardware behind it, so this job is what stands in for "install it
  # and see".
  #
  # It installs the exact APK the release job produced (not a rebuild) and
  # asserts the app starts and survives. Two screenshots come back as an
  # artifact, which is also the only way to LOOK at this app without a device.
  smoke:
    name: Release smoke test
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download the release APK built above
        uses: actions/download-artifact@v8
        with:
          name: app-release-ci-signed
          path: artifact

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The emulator needs hardware acceleration to be usable. GitHub's Linux
      # runners expose /dev/kvm but not to the runner user by default.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot an emulator, install the release APK, launch it
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      # Uploaded even on failure — a screenshot of the broken state is the most
      # useful thing to have when the assertion above trips.
      - name: Upload launch screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-screenshots
          path: |
            launch.png
            home.png
            landscape.png
          if-no-files-found: warn
