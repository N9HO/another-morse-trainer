name: iOS release (App Store upload)

# Fires when you push an iOS version tag
# (e.g. `git tag ios-v1.2 && git push origin ios-v1.2`).
#
# The tag prefix matters: this is a monorepo holding both apps, and the Android
# release workflow watches `android-v*`. A bare `v*` tag would fire both, so each
# platform releases under its own namespace and the two cadences stay independent.
#
# Runs `ios/tools/upload-testflight.sh` — the same script used by hand on a Mac —
# rather than reimplementing archive/export/upload in YAML. CI's only job is to
# reconstruct the credentials that script expects, so the two paths cannot drift.
#
# A tag push is a PRODUCTION release: the script uploads the build, attaches it
# to the App Store version named by MARKETING_VERSION, sets What's New from
# ios/tools/whatsnew/whatsnew-en-US, and submits it to App Review with
# release-after-approval. The Android twin (android-release.yml) ships to the
# Play production track on the same trigger. A manual run can choose the
# `testflight` channel instead, which is the beta path this workflow used to
# be: Beta App Review plus the previous build's testers. Either way the build
# also appears in TestFlight, so testers see a production build first.
#
# A manual run can also pick `platform: maccatalyst`, the Mac build of the
# same target (#264): archived for Mac Catalyst, uploaded as a .pkg to the
# same App Store Connect record, TestFlight channel only, tagged
# mac-beta-v<version>-b<build> (which discord-release.yml does not announce).
# Tags always ship the iPhone build.
#
# `channel: developer-id` with `platform: maccatalyst` is the Mac DOWNLOAD,
# for a GitHub release: exported Developer ID-signed, notarized and stapled,
# and uploaded as the workflow artifact `mac-developer-id`
# (AnotherMorseTrainer-Mac.zip). It uploads nothing to App Store Connect,
# spends no build number and is never tagged. Cloud signing cannot do
# Developer ID with an API key (Apple bug FB16835802), so this channel alone
# imports the certificate from DEVID_APP_P12 / DEVID_APP_P12_PASSWORD.
#
# Every successful upload is TAGGED, by the `tag` job below, so the Discord
# announcement has a name and each changelog starts where the last one ended:
#   ios-v<MARKETING_VERSION>-b<build>       an App Store submission
#   ios-beta-v<MARKETING_VERSION>-b<build>  a TestFlight-channel build
# A tag push already carries its tag, so only a manual run creates one. The
# tag is pushed with GITHUB_TOKEN, and GitHub never starts a workflow from a
# GITHUB_TOKEN push, so an `ios-v*` tag made here cannot re-fire this
# workflow. `ios-beta-v*` does not match the `ios-v*` trigger either way.
# An existing tag is never moved.
#
# NO `paths:` FILTER, deliberately. Every other workflow here is path-filtered
# because macOS bills at 10x Linux, but this one is tag-triggered: on a tag push
# GitHub evaluates `paths:` against the tagged commit's changed files, so a
# release tag on a commit that happened to touch only android/ would silently
# not release. Tag namespacing already does the filtering.
#
# Required repository secrets:
#   ASC_KEY_ID     - App Store Connect API key ID. MUST be an ADMIN team key:
#                    cloud signing fails on App Manager with "Cloud signing
#                    permission error". See tools/ExportOptions.plist.
#   ASC_ISSUER_ID  - the team's issuer UUID (same for every key)
#   ASC_APP_ID     - the app's numeric App Store Connect id
#   ASC_API_KEY_P8 - base64 of the key's .p8  (`base64 -i AuthKey_XXX.p8`)
# For the developer-id channel only:
#   DEVID_APP_P12          - base64 of a .p12 holding the Developer ID
#                            Application certificate and its private key
#   DEVID_APP_P12_PASSWORD - that .p12's password
# Optional, read by `asc-api.py prepare` for the App Review contact:
#   ASC_REVIEW_FIRST_NAME, ASC_REVIEW_LAST_NAME, ASC_REVIEW_PHONE, ASC_REVIEW_EMAIL
#
# No distribution certificate or provisioning profile is needed: signing is
# cloud-managed, so Apple holds the private key and signs server-side.

on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to "true" to archive and cloud-sign without uploading'
        required: false
        default: "false"
      submit_only:
        description: 'Set to "true" to skip the build and only (re)submit the build already uploaded for the current build number'
        required: false
        default: "false"
      channel:
        description: 'Where it goes: appstore (App Review, default), testflight (Beta App Review) or developer-id (Mac download artifact, uploads nothing)'
        required: false
        default: "appstore"
        type: choice
        options:
          - appstore
          - testflight
          - developer-id
      # Which build of the app: the iPhone one (default, and what every tag
      # push ships) or the Mac Catalyst one (#264). The Mac build is
      # TestFlight-only for now; the script refuses maccatalyst + appstore.
      platform:
        description: 'Which build: ios (iPhone, default) or maccatalyst (Mac, TestFlight channel only)'
        required: false
        default: "ios"
        type: choice
        options:
          - ios
          - maccatalyst

permissions:
  contents: read

# Never let two releases race for the same build number.
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    name: Archive + upload + submit
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags, for the "notes unchanged since the last release" check.
          fetch-depth: 0

      # NOT /Applications/Xcode.app: on macos-15 that symlinks to Xcode 16.4,
      # whose iOS 18.5 SDK App Store Connect now refuses outright —
      # "All iOS and iPadOS apps must be built with the iOS 26 SDK or later".
      # Picks the newest Xcode 26.x present rather than pinning an exact
      # version, so a runner-image update doesn't break releases.
      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26.x on this runner. App Store Connect rejects anything built with an older SDK, so failing before the build rather than after the upload."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -switch "$XC"
          xcodebuild -version

      # A rebuild may legitimately reuse the notes, so this warns rather than
      # fails. It is the reminder that testers and App Review read this file.
      # A TestFlight build is compared with the last build of either kind; an
      # App Store release with the last App Store release, since its notes
      # usually gather what the TestFlight builds before it already said.
      - name: Warn if the release notes are unchanged since the last release
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.submit_only != 'true' && github.event.inputs.channel != 'developer-id'
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'appstore' }}
        run: |
          set -euo pipefail
          NOTES=tools/whatsnew/whatsnew-en-US
          if [ "$RELEASE_CHANNEL" = "testflight" ]; then
            PREV="$(git describe --tags --abbrev=0 --match 'ios-v*' --match 'ios-beta-v*' HEAD^ 2>/dev/null || true)"
          else
            PREV="$(git describe --tags --abbrev=0 --match 'ios-v*' HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$PREV" ] && git diff --quiet "$PREV" HEAD -- "$NOTES"; then
            echo "::warning::ios/$NOTES has not changed since $PREV. Testers and App Review will read the previous build's notes."
          fi

      - name: Install cryptography (asc-api.py's only dependency)
        run: |
          set -euo pipefail
          # Runner python is Homebrew-managed and marks itself externally
          # managed; --break-system-packages is the sanctioned override on an
          # ephemeral runner. Fall back for images where the flag isn't needed.
          python3 -m pip install --break-system-packages cryptography \
            || python3 -m pip install cryptography

      - name: Reconstruct the credentials the script reads
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_APP_ID ASC_API_KEY_P8; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set. iOS releases need all four."
              exit 1
            fi
          done

          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # A .p8 that decoded to junk produces a baffling JWT error much later.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_API_KEY_P8 did not decode to a PEM private key. Re-create it with: base64 -i AuthKey_${ASC_KEY_ID}.p8"
            exit 1
          fi

          # Write the same gitignored file a local run sources, so the script
          # needs no CI-specific branch.
          cat > tools/asc-auth.sh <<EOF
          export ASC_KEY_ID="$ASC_KEY_ID"
          export ASC_ISSUER_ID="$ASC_ISSUER_ID"
          export ASC_KEY_PATH="$KEY_PATH"
          export ASC_APP_ID="$ASC_APP_ID"
          export ASC_BUNDLE_ID="com.justinrogers.MorseTrainer"
          EOF
          chmod 600 tools/asc-auth.sh

      - name: Create a temporary keychain
        run: |
          set -euo pipefail
          # Archiving with automatic signing needs somewhere to put the signing
          # identity Xcode provisions. Use a throwaway keychain rather than the
          # runner's login keychain so nothing is left behind, and so a failure
          # can't strand an unlocked keychain holding credentials.
          KC="$RUNNER_TEMP/ios-release.keychain-db"
          PW="$(openssl rand -hex 20)"
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings "$KC"          # no auto-lock mid-build
          security unlock-keychain -p "$PW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -d user -s "$KC"
          # Only the Developer ID export needs this; save the password for it.
          echo "::add-mask::$PW"
          echo "KEYCHAIN_PASSWORD=$PW" >> "$GITHUB_ENV"

      # Cloud signing cannot produce Developer ID with an API key (Apple bug
      # FB16835802: 403 on cloud-managed Developer ID certificates), so this
      # channel signs manually with a real certificate; the script makes the
      # provisioning profile through the API key.
      - name: Import the Developer ID certificate (developer-id channel only)
        if: github.event.inputs.channel == 'developer-id'
        env:
          DEVID_APP_P12: ${{ secrets.DEVID_APP_P12 }}
          DEVID_APP_P12_PASSWORD: ${{ secrets.DEVID_APP_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DEVID_APP_P12" ] || [ -z "$DEVID_APP_P12_PASSWORD" ]; then
            echo "::error::DEVID_APP_P12 and DEVID_APP_P12_PASSWORD must be set for the developer-id channel."
            exit 1
          fi
          P12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$DEVID_APP_P12" | base64 -d > "$P12"
          security import "$P12" -k "$KEYCHAIN_PATH" -P "$DEVID_APP_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          rm -f "$P12"
          # Without this codesign stops at a keychain access prompt nobody answers.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # The chain up to Apple's root: the Developer ID G2 intermediate is
          # not guaranteed to be on the runner image.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" || true
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application'; then
            echo "::error::No valid Developer ID Application identity after the import."
            exit 1
          fi

      - name: Archive, cloud-sign, upload and submit
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          # The upload and the submission fail independently. A submission
          # that failed on metadata after a successful upload is retried with
          # submit_only, because the build number is already spent.
          SUBMIT_ONLY: ${{ github.event.inputs.submit_only == 'true' && '1' || '0' }}
          # A tag push has no inputs, so a release resolves to appstore.
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'appstore' }}
          # And to the iPhone build.
          RELEASE_PLATFORM: ${{ github.event.inputs.platform || 'ios' }}
          # App Review contact for `asc-api.py prepare`. Optional: when the
          # secrets are unset the contact already on the version is kept.
          ASC_REVIEW_FIRST_NAME: ${{ secrets.ASC_REVIEW_FIRST_NAME }}
          ASC_REVIEW_LAST_NAME: ${{ secrets.ASC_REVIEW_LAST_NAME }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
          ASC_REVIEW_EMAIL: ${{ secrets.ASC_REVIEW_EMAIL }}
        run: ./tools/upload-testflight.sh

      # The Mac download: never uploaded to App Store Connect, so it is
      # handed over here instead. Attach it to a GitHub release by hand.
      - name: Save the notarized Mac download
        if: github.event.inputs.channel == 'developer-id'
        uses: actions/upload-artifact@v6
        with:
          name: mac-developer-id
          path: ios/build/export/AnotherMorseTrainer-Mac.zip
          if-no-files-found: error
          retention-days: 30

      # The name the `tag` job pushes and the announcement uses. Empty on a
      # dry run, which uploads nothing, and on a developer-id run, which
      # uploads nothing to App Store Connect either: no tag, no announcement.
      - name: Name the release tag
        id: tag
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.channel != 'developer-id'
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'appstore' }}
          RELEASE_PLATFORM: ${{ github.event.inputs.platform || 'ios' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' MorseTrainer.xcodeproj/project.pbxproj | grep -oE '[0-9]+')
            MARKETING=$(grep -m1 'MARKETING_VERSION' MorseTrainer.xcodeproj/project.pbxproj | grep -oE '[0-9]+(\.[0-9]+)*')
            if [ "$RELEASE_PLATFORM" = "maccatalyst" ]; then
              # Its own namespace: the iPhone build of the same number has
              # (or will have) ios-beta-v…-b<N>. discord-release.yml does not
              # know this prefix, so a Mac build is not announced on its own;
              # announce it by hand once there is something to say.
              TAG="mac-beta-v${MARKETING}-b${BUILD}"
            elif [ "$RELEASE_CHANNEL" = "testflight" ]; then
              TAG="ios-beta-v${MARKETING}-b${BUILD}"
            else
              TAG="ios-v${MARKETING}-b${BUILD}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG"

      # `always()` so a failed or cancelled run still tears the keychain down.
      - name: Delete the temporary keychain
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/devid.p12 tools/asc-auth.sh || true

      - name: Save the archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-release-logs
          path: ios/build/export/Packaging.log
          if-no-files-found: ignore
          retention-days: 7

  # Separate from the release job so the write permission is held only by this
  # job, not by the job that runs the archive with the App Store key.
  tag:
    name: Tag the release
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Push the tag (never moves an existing one)
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Fetch it by name if it exists, then peel it to its commit.
          if git fetch -q --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null; then
            AT="$(git rev-parse "${TAG}^{commit}")"
            if [ "$AT" = "$GITHUB_SHA" ]; then
              echo "$TAG already points at this commit."
            else
              echo "::warning::$TAG already exists at ${AT:0:12}, not this run's ${GITHUB_SHA:0:12}. Left where it is; the announcement uses it as named."
            fi
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Pushed $TAG at ${GITHUB_SHA:0:12}."

      # discord-release.yml reads this to know what the run released: a
      # manual run's head_branch is `main`, not a tag.
      - name: Record the tag for the announcement
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: printf '%s\n' "$TAG" > release-tag.txt

      - uses: actions/upload-artifact@v6
        with:
          name: release-tag
          path: release-tag.txt
          retention-days: 7
